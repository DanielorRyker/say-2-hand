version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: say2hand-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: say2hand
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - say2hand-network

  redis:
    image: redis:7-alpine
    container_name: say2hand-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - say2hand-network

  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: say2hand-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/say2hand?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development-jwt-secret-key
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_MAX=100
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ../../apps/backend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - say2hand-network

  frontend:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: say2hand-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - say2hand-network

volumes:
  mongodb_data:
  redis_data:

networks:
  say2hand-network:
    driver: bridge
