# Task 54-56: CI/CD Pipeline với GitHub Actions

name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # Job 1: Lint và Type Check
    lint-and-typecheck:
        name: Lint & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.2.23"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run ESLint
              run: bun run lint

            - name: Type check
              run: bun run type-check
              continue-on-error: true

    # Job 2: Unit Tests
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest

        services:
            mongodb:
                image: mongo:7
                env:
                    MONGO_INITDB_ROOT_USERNAME: admin
                    MONGO_INITDB_ROOT_PASSWORD: password
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.2.23"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run unit tests
              run: bun run test
              env:
                  MONGODB_URI: mongodb://admin:password@localhost:27017/say2hand_test?authSource=admin
                  REDIS_URL: redis://localhost:6379
                  JWT_SECRET: test_jwt_secret_key_for_testing

            - name: Upload coverage
              uses: codecov/codecov-action@v4
              with:
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
              continue-on-error: true

    # Job 3: E2E Tests
    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest

        services:
            mongodb:
                image: mongo:7
                env:
                    MONGO_INITDB_ROOT_USERNAME: admin
                    MONGO_INITDB_ROOT_PASSWORD: password
                ports:
                    - 27017:27017

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.2.23"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run E2E tests
              run: cd apps/backend && bun run test:e2e
              env:
                  MONGODB_URI: mongodb://admin:password@localhost:27017/say2hand_test?authSource=admin
                  REDIS_URL: redis://localhost:6379
                  JWT_SECRET: test_jwt_secret_key_for_testing

    # Job 4: Build Docker Images
    build:
        name: Build Docker Images
        runs-on: ubuntu-latest
        needs: [lint-and-typecheck, unit-tests]
        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                service: [backend, frontend]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./apps/${{ matrix.service }}/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # Job 5: Security Scan
    security-scan:
        name: Security Scan
        runs-on: ubuntu-latest
        needs: [build]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-results.sarif"

            - name: Upload Trivy results to GitHub Security
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-results.sarif"

    # Job 6: Deploy to Staging
    deploy-staging:
        name: Deploy to Staging
        runs-on: ubuntu-latest
        needs: [build, e2e-tests]
        if: github.ref == 'refs/heads/develop'
        environment:
            name: staging
            url: https://staging.say2hand.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to staging
              run: |
                  echo "Deploying to staging environment..."
                  # Add your deployment commands here
                  # Example: SSH to server and pull new images

            - name: Run smoke tests
              run: |
                  echo "Running smoke tests..."
                  curl -f https://staging.say2hand.com/health || exit 1

    # Job 7: Deploy to Production
    deploy-production:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: [build, e2e-tests, security-scan]
        if: github.ref == 'refs/heads/main'
        environment:
            name: production
            url: https://say2hand.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to production
              run: |
                  echo "Deploying to production environment..."
                  # Add your deployment commands here

            - name: Run smoke tests
              run: |
                  echo "Running production smoke tests..."
                  curl -f https://say2hand.com/health || exit 1

            - name: Notify team
              if: success()
              run: |
                  echo "✅ Deployment successful!"
                  # Add notification (Slack, Discord, Email, etc.)

            - name: Rollback on failure
              if: failure()
              run: |
                  echo "❌ Deployment failed - initiating rollback"
                  # Add rollback commands here
